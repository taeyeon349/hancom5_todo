<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>한컴5기 중간평가 - Todo 리스트</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .completed { text-decoration: line-through; color: #6c757d; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0">📝 할 일 관리 API 시스템 (접속자: <span id="user-display">testuser</span>)</h4>
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-4">
                            <input type="text" id="todo-input" class="form-control" placeholder="새로운 할 일을 입력하세요...">
                            <button class="btn btn-success" id="add-btn" type="button">추가하기</button>
                        </div>
                        <ul class="list-group" id="todo-list"></ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
