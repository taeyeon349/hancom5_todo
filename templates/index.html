<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>시스템 모니터링 및 할 일 관리</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .completed { text-decoration: line-through; color: #6c757d; }
        #todo-section { display: none; }
    </style>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                
                <div class="card shadow-sm mb-4" id="login-section">
                    <div class="card-header bg-dark text-white text-center">
                        <h5 class="mb-0">🔒 시스템 인증</h5>
                    </div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label for="login-id" class="form-label">아이디</label>
                            <input type="text" id="login-id" class="form-control" value="testuser" placeholder="아이디를 입력하세요">
                        </div>
                        <div class="mb-3">
                            <label for="login-pwd" class="form-label">비밀번호</label>
                            <input type="password" id="login-pwd" class="form-control" value="1234" placeholder="비밀번호를 입력하세요">
                        </div>
                        <button class="btn btn-primary w-100 mb-2" id="login-btn" type="button">로그인</button>
                        <button class="btn btn-outline-secondary w-100" type="button" data-bs-toggle="modal" data-bs-target="#registerModal">회원가입</button>
                    </div>
                </div>

                <div class="card shadow-sm" id="todo-section">
                    <div class="card-header bg-primary text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">📝 할 일 목록</h5>
                        <div class="d-flex align-items-center gap-2">
                            <span class="badge bg-light text-dark" style="font-size: 0.9rem;">
                                사용자: <span id="user-display"></span>
                            </span>
                            <button class="btn btn-sm btn-danger" id="logout-btn" style="font-size: 0.8rem; font-weight: bold;">로그아웃</button>
                        </div>
                    </div>
                    <div class="card-body">
                        <div class="input-group mb-4">
                            <input type="text" id="todo-input" class="form-control" placeholder="새로운 항목을 입력하세요...">
                            <button class="btn btn-success" id="add-btn" type="button">추가</button>
                        </div>
                        <ul class="list-group" id="todo-list"></ul>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header bg-secondary text-white">
                    <h5 class="modal-title" id="registerModalLabel">👤 시스템 회원가입</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dash="modal" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div class="mb-3">
                        <label for="reg-name" class="form-label">이름</label>
                        <input type="text" id="reg-name" class="form-control" placeholder="이름을 입력하세요">
                    </div>
                    <div class="mb-3">
                        <label for="reg-id" class="form-label">아이디</label>
                        <input type="text" id="reg-id" class="form-control" placeholder="사용할 아이디를 입력하세요">
                    </div>
                    <div class="mb-3">
                        <label for="reg-pwd" class="form-label">비밀번호</label>
                        <input type="password" id="reg-pwd" class="form-control" placeholder="비밀번호를 입력하세요">
                    </div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">취소</button>
                    <button type="button" class="btn btn-success" id="submit-register-btn">가입 완료</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.4.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/script.js"></script>
</body>
</html>
